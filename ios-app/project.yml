name: SoleID
options:
  bundleIdPrefix: com.soleid
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""  # Add your team ID
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_FILE: SoleID/Resources/Info.plist

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "10.0.0"

targets:
  SoleID:
    type: application
    platform: iOS
    sources:
      - path: SoleID/Sources
      - path: SoleID/Resources
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebasePerformance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soleid.app
        PRODUCT_NAME: SoleID
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
    preBuildScripts:
      - name: Firebase Crashlytics
        script: |
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
        inputFiles:
          - $(DWARF_DSYM_FOLDER_PATH)/$(DWARF_DSYM_FILE_NAME)/Contents/Resources/DWARF/$(TARGET_NAME)
          - $(SRCROOT)/$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
        runOnlyWhenInstalling: true

  SoleIDTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoleIDTests
    dependencies:
      - target: SoleID

schemes:
  SoleID:
    build:
      targets:
        SoleID: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SoleIDTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
