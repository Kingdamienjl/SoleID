version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: soleid-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: ../backend
    container_name: soleid-backend
    restart: unless-stopped
    environment:
      - QDRANT_URL=http://qdrant:6333
      - MOCK_EMBEDDING=true
    env_file:
      - ../backend/.env.example
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

volumes:
  qdrant_storage:
