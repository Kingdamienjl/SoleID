version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: soleid-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: ../backend
    container_name: soleid-backend
    restart: unless-stopped
    environment:
      - QDRANT_URL=http://qdrant:6333
      - MOCK_EMBEDDING=true
      - REDIS_URL=redis://soleid-redis:6379/0
    env_file:
      - ../backend/.env.example
    depends_on:
      - qdrant
      - redis
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
  redis:
    image: redis:7-alpine
    container_name: soleid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  qdrant_storage:
