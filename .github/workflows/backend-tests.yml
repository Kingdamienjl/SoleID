name: Backend Tests

on:
  push:
    branches: [ "master", "phase3-development" ]
  pull_request:
    branches: [ "master", "phase3-development" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Run tests
        env:
          PYTHONPATH: backend
          MOCK_EMBEDDING: "true"
        run: |
          python -m pytest -q

