name: Secret Scan

on:
  push:
    branches: [ "master", "phase3-development" ]
  pull_request:
    branches: [ "master", "phase3-development" ]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_NOTIFY_USER: ${{ github.actor }}
        with:
          args: detect --redact --no-banner

