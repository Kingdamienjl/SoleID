name: Link Check

on:
  push:
    branches: [ "master", "phase3-development" ]
  pull_request:
    branches: [ "master", "phase3-development" ]

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --accept 200..=299 --timeout 20s .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

